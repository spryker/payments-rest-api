resource:
    name: PaymentCancellations
    shortName: payment-cancellations
    description: 'Pre-order payment cancellation'

    processor: Spryker\Glue\PaymentsRestApi\Api\Storefront\Processor\PaymentCancellationsStorefrontProcessor

    paginationEnabled: false

    operations:
        - type: Post
          description: 'Cancel a pre-order payment'
          # The resource has no item operation, so there is no IRI to generate for the created
          # representation — without this the success response fails to serialize.
          normalizationContext:
              gen_id: false
          openapiContext:
              responses:
                  201:
                      description: 'Pre-order payment cancelled.'
                  400:
                      description: 'Request body is missing or its resource type is not payment-cancellations.'
                  422:
                      description: 'Request attributes failed validation, or the payment provider rejected the cancellation.'

    properties:
        cancellationId:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Identifier of the cancellation request'
            openapiContext:
                example: '0'

        payment:
            type: object
            objectName: PaymentSelection
            writable: true
            readable: false
            required: true
            description: 'Payment selection of the payment being cancelled'
            properties:
                paymentProviderName:
                    type: string
                    description: 'Payment provider name.'
                    openapiContext:
                        example: 'DummyPayment'
                paymentMethodName:
                    type: string
                    description: 'Payment method name.'
                    openapiContext:
                        example: 'Invoice'

        preOrderPaymentData:
            type: map
            writable: true
            readable: false
            required: true
            description: 'PSP-issued payload from the original pre-order initialization, replayed to identify the transaction to cancel'
            openapiContext:
                required: ['transactionId']
                properties:
                    transactionId:
                        type: string
                        example: 'tx_abc123'
                example:
                    transactionId: 'tx_abc123'

        isSuccessful:
            type: boolean
            writable: false
            readable: true
            required: false
            description: 'Indicates whether the cancellation succeeded'
            openapiContext:
                example: true

        error:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Error message returned when cancellation fails'
            openapiContext:
                example: 'Payment cancellation failed'
