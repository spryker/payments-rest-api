resource:
    name: PaymentCustomers
    shortName: payment-customers
    description: 'Payment customer data retrieval'

    processor: Spryker\Glue\PaymentsRestApi\Api\Storefront\Processor\PaymentCustomersStorefrontProcessor

    paginationEnabled: false

    operations:
        - type: Post
          description: 'Get payment customer data'

    properties:
        customerId:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Identifier of the resolved payment customer'
            openapiContext:
                example: '0'

        customer:
            type: object
            objectName: Customer
            writable: true
            readable: true
            required: true
            description: 'Customer context sent in the request, enriched with PSP data in the response'
            properties:
                salutation:
                    type: string
                    description: 'Customer salutation.'
                    openapiContext:
                        example: 'Mrs'
                firstName:
                    type: string
                    description: 'Customer first name.'
                    openapiContext:
                        example: 'Sonia'
                lastName:
                    type: string
                    description: 'Customer last name.'
                    openapiContext:
                        example: 'Wagner'
                email:
                    type: string
                    description: 'Customer email address.'
                    openapiContext:
                        example: 'sonia@acme.com'

        payment:
            type: object
            objectName: PaymentSelection
            writable: true
            readable: false
            required: true
            description: 'Payment selection used to resolve the customer at the PSP'
            properties:
                paymentProviderName:
                    type: string
                    description: 'Payment provider name.'
                    openapiContext:
                        example: 'Invoice'
                paymentMethodName:
                    type: string
                    description: 'Payment method name.'
                    openapiContext:
                        example: 'Invoice'

        customerPaymentServiceProviderData:
            type: map
            writable: true
            readable: false
            required: true
            description: 'PSP-specific customer payload (shape determined by the payment provider)'
            openapiContext:
                example:
                    pspCustomerId: 'cus_abc123'
                    token: 'tok_xyz789'

        isSuccessful:
            type: boolean
            writable: false
            readable: true
            required: false
            description: 'Indicates whether the customer lookup succeeded'
            openapiContext:
                example: true
