resource:
    name: Payments
    shortName: payments
    description: 'Pre-order payment initialization'

    processor: Spryker\Glue\PaymentsRestApi\Api\Storefront\Processor\PaymentsStorefrontProcessor

    paginationEnabled: false

    operations:
        - type: Post
          description: 'Initialize a pre-order payment'

    properties:
        paymentId:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Identifier of the initialized payment'
            openapiContext:
                example: '0'

        payment:
            type: object
            objectName: PaymentSelection
            writable: true
            readable: false
            required: true
            description: 'Payment selection for the pre-order initialization'
            properties:
                paymentProviderName:
                    type: string
                    description: 'Payment provider name.'
                    openapiContext:
                        example: 'DummyPayment'
                paymentMethodName:
                    type: string
                    description: 'Payment method name.'
                    openapiContext:
                        example: 'Invoice'
                amount:
                    type: integer
                    description: 'Amount in minor units (cents).'
                    openapiContext:
                        example: 9999

        quote:
            type: object
            objectName: PaymentQuote
            writable: true
            readable: false
            required: true
            description: 'Quote context required to initialize the payment'
            properties:
                customer:
                    type: object
                    description: 'Customer context.'
                    properties:
                        firstName:
                            type: string
                            description: 'Customer first name.'
                            openapiContext:
                                example: 'Sonia'
                        lastName:
                            type: string
                            description: 'Customer last name.'
                            openapiContext:
                                example: 'Wagner'
                        email:
                            type: string
                            description: 'Customer email address.'
                            openapiContext:
                                example: 'sonia@acme.com'
                billingAddress:
                    type: object
                    description: 'Billing address.'
                    properties:
                        iso2Code:
                            type: string
                            description: 'ISO2 country code.'
                            openapiContext:
                                example: 'DE'
                currency:
                    type: object
                    description: 'Currency.'
                    properties:
                        code:
                            type: string
                            description: 'Currency code.'
                            openapiContext:
                                example: 'EUR'

        preOrderPaymentData:
            type: map
            writable: false
            readable: true
            required: false
            description: 'PSP-specific response payload returned by the payment provider'
            openapiContext:
                example:
                    transactionId: 'tx_abc123'
                    redirectUrl: 'https://psp.example.com/pay/tx_abc123'

        isSuccessful:
            type: boolean
            writable: false
            readable: true
            required: false
            description: 'Indicates whether payment initialization succeeded'
            openapiContext:
                example: true
